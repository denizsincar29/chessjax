<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>chessjax на голой странице</title>
</head>
<body>
<!-- Страница-проба: ни одного своего стиля, только тег и chessjax.js. Доска
     обязана нарисоваться сама — сеткой, а не столбиком фигур. Эту страницу
     открывает test-dom.mjs (раздел «голая страница»); в примерах её нет. -->
<h1>Голая страница</h1>
<chessjax-board id="bare"></chessjax-board>

<script type="module" data-sound-base="/sound">
  import "./chessjax.js";
  document.getElementById("bare")
    .setAttribute("fen", "r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 1 5");
</script>
</body>
</html>
