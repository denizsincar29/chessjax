<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181c">
<link rel="icon" href="data:,">
<title>chessjax — доступная шахматная доска</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>chessjax</h1>
  <p>Доступный рендер шахмат: семантическая таблица + озвучка ходов для скринридера.</p>
</header>

<main>
  <section aria-labelledby="playground-heading">
    <h2 id="playground-heading" class="visually-hidden">Настройки</h2>
    <div class="lang-switch">
      <label for="lang">Язык:</label>
      <select id="lang">
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="tr">Türkçe</option>
      </select>
      <label for="fen" style="margin-left:1rem">FEN:</label>
      <input id="fen" type="text" spellcheck="false" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
      <button id="apply" type="button">Показать</button>
    </div>
    <p id="error" class="error" aria-live="assertive"></p>
  </section>

  <section aria-labelledby="board-heading">
    <h2 id="board-heading" class="visually-hidden">Доска</h2>
    <chessjax-board id="demo"></chessjax-board>
  </section>

  <section aria-labelledby="examples-heading">
    <h2 id="examples-heading">Примеры</h2>
    <p><a href="examples/basic.html">Базовые доски и язык</a> · <a href="examples/story.html">Партия с кнопками-ходами</a></p>
  </section>
</main>

<script type="module">
  import { chessjax } from "./chessjax.js";
  const input = document.getElementById("fen");
  const board = document.getElementById("demo");
  const errorEl = document.getElementById("error");
  const langSel = document.getElementById("lang");

  function show() {
    errorEl.textContent = "";
    board.setAttribute("fen", input.value);
    board.removeAttribute("pgn");
    board.removeAttribute("pgn-src");
  }
  document.getElementById("apply").addEventListener("click", show);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") show();
  });
  langSel.addEventListener("change", () => chessjax.setLanguage(langSel.value));
  show();
</script>
</body>
</html>
